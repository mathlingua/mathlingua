[package]
name = "mlg"
version = "1.0.0"
edition = "2024"
description = "Mathlingua command-line interface"

[build-dependencies]
lalrpop = "0.23.1"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.28"
lalrpop-util = "0.23.1"
logos = "0.16.1"
lsp-server = "0.7"
lsp-types = "0.95"
mime_guess = "2.0.5"
ratatui = "0.29"
rust-embed = { version = "8.12.0", features = ["debug-embed", "deterministic-timestamps"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sha2 = "0.10"
tiny_http = "0.12.0"
uuid = { version = "1", features = ["v4"] }
