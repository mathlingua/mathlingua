<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3d2318" />
    <style>
      html, body {
        background-color: #3d2318;
      }
      html[data-theme="journal"],
      html[data-theme="journal"] body {
        background-color: #3d2318 !important;
      }
      html[data-theme="journal-dark"],
      html[data-theme="journal-dark"] body {

    </style>
    <base href="__MLG_BASE_HREF__" />
    <meta name="description" content="Rendered Mathlingua collection viewer" />
    <link rel="icon" href="./icon.png" />
    <link rel="apple-touch-icon" href="./apple-icon.png" />
    <title>MathLingua Viewer</title>
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("mlg-view-theme");
          const storedFamily = window.localStorage.getItem("mlg-view-theme-family");
          const storedMode = window.localStorage.getItem("mlg-view-theme-mode");
          const familyVariants = {
            atomic: { light: "atomic", dark: "atomic-dark" },
            classic: { light: "classic", dark: "classic-dark" },
            "field-guide": { light: "field-guide", dark: "field-guide-dark" },
            "flat-gray": { light: "flat-gray", dark: "flat-gray-dark" },
            journal: { light: "journal", dark: "journal-dark" },
            lcd: { light: "lcd", dark: "lcd-dark" },
            manuscript: { light: "manuscript", dark: "manuscript-dark" },
            mono: { light: "mono", dark: "dark" },
            retro: { light: "retro", dark: "retro-dark" },
            sepia: { light: "sepia", dark: "sepia-dark" },
          };
          const family = storedFamily || (storedTheme ? null : "journal");
          const mode = storedMode || (storedTheme ? null : "auto");
          let theme = storedTheme;
          if (family && familyVariants[family]) {
            const isDark =
              mode === "dark" ||
              (mode === "auto" &&
                window.matchMedia("(prefers-color-scheme: dark)").matches);
            theme = isDark
              ? familyVariants[family].dark
              : familyVariants[family].light;
          } else if (!theme) {
            const isDark =
              window.matchMedia("(prefers-color-scheme: dark)").matches;
            theme = isDark ? "journal-dark" : "journal";
          }
          const themeSchemes = {
            atomic: "light",
            "atomic-dark": "dark",
            classic: "light",
            "classic-dark": "dark",
            "field-guide": "light",
            "field-guide-dark": "dark",
            "flat-gray": "light",
            "flat-gray-dark": "dark",
            journal: "light",
            "journal-dark": "dark",
            lcd: "light",
            "lcd-dark": "dark",
            manuscript: "light",
            "manuscript-dark": "dark",
            mono: "light",
            dark: "dark",
            retro: "light",
            "retro-dark": "dark",
            sepia: "light",
            "sepia-dark": "dark",
          };
          const colorScheme = themeSchemes[theme];
          if (colorScheme) {
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = colorScheme;
            const initialSafeAreaColors = {
              journal: "#3d2318",
              "journal-dark": "#24150e",
              "field-guide": "#fbf8ef",
              "field-guide-dark": "#171b1c",
            };
            const safeAreaColor =
              initialSafeAreaColors[theme] ??
              (colorScheme === "dark" ? "#111315" : "#ffffff");
            document.documentElement.style.backgroundColor = safeAreaColor;
            if (document.body) {
              document.body.style.backgroundColor = safeAreaColor;
            } else {
              document.addEventListener("DOMContentLoaded", () => {
                if (document.body) {
                  document.body.style.backgroundColor = safeAreaColor;
                }
              });
            }
            document
              .querySelector('meta[name="theme-color"]')
              ?.setAttribute("content", safeAreaColor);
          }

          const font = window.localStorage.getItem("mlg-view-font");
          if (font === "euler") {
            document.documentElement.dataset.font = "euler";
          }

          const spacing = window.localStorage.getItem("mlg-view-spacing");
          if (["compact", "comfortable", "spacious"].includes(spacing)) {
            document.documentElement.dataset.spacing = spacing;
          }

          const fontScale = Number(
            window.localStorage.getItem("mlg-view-font-scale"),
          );
          if ([0.8, 0.9, 1, 1.1, 1.2, 1.3, 1.4].includes(fontScale)) {
            document.documentElement.style.setProperty(
              "--viewer-font-scale",
              String(fontScale),
            );
          }
        } catch (_) {}
      })();
      window.__MLG_VIEW_CONFIG__ = __MLG_RUNTIME_CONFIG_JSON__;
    </script>

  </head>

    <div id="root"></div>
  </body>
</html>
